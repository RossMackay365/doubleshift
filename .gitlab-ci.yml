stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2

.docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
  script:
    - docker build -t $SERVICE_NAME ./$SERVICE_NAME

build-backend:
  extends: .docker-build
  variables:
    SERVICE_NAME: backend

build-frontend:
  extends: .docker-build
  variables:
    SERVICE_NAME: frontend

deploy-prod:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - "curl --fail-with-body -X GET \"$COOLIFY_WEBHOOK_URL?uuid=$COOLIFY_UUID_BACKEND_PROD&force=false\" -H \"Authorization: Bearer $COOLIFY_API_TOKEN\""
    - "curl --fail-with-body -X GET \"$COOLIFY_WEBHOOK_URL?uuid=$COOLIFY_UUID_FRONTEND_PROD&force=false\" -H \"Authorization: Bearer $COOLIFY_API_TOKEN\""
  only:
    - main